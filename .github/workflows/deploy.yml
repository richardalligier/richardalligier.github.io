name: Build and Deploy

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - '*'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install the dependencies
        run: |
          python -m pip install -r ./notebooks/requirements.txt
      - name: Build the JupyterLite site
        run: |
          jupyter nbconvert source/prerequis-IA_BASE.ipynb --to notebook --TagRemovePreprocessor.remove_cell_tags='{"hidden","prompt"}' --TagRemovePreprocessor.enabled=True --output prerequis-IA_BASE_corrected.ipynb
          jupyter nbconvert source/prerequis-IA_BASE.ipynb --to notebook --TagRemovePreprocessor.remove_cell_tags='{"corrected","prompt"}' --TagRemovePreprocessor.enabled=True --output prerequis-IA_BASE.ipynb
          jupyter lite build --contents notebooks --output-dir dist/lab
      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5
      - name: Build with Jekyll
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./dist/_site
      - name: Copy
        run: |
          cp -r ./dist/_site/* ./dist/
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
